# Publicação alternativa, na Cloudflare. A publicação principal é na Vercel,
# configurada em vercel.json.
#
# A página é pré-renderizada em HTML estático, então não existe função de
# servidor para publicar: é só entregar a pasta dist/client.
#
#   npm run build
#   npx wrangler deploy
#
# ATENÇÃO antes de trocar o destino dos anúncios: a URL final precisa ser um
# domínio da América. Um endereço de plataforma (*.workers.dev, *.vercel.app)
# serve para revisão interna, nunca como destino de anúncio. Ajuste também
# SITE_URL em src/lib/config.ts quando o domínio existir.

name = "america-rental-car-lp-atendimento"
compatibility_date = "2026-08-11"

[assets]
directory = "dist/client"

