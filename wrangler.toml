# Publicação na Cloudflare Workers.
#
# ATENÇÃO antes de rodar: o domínio final ainda não está definido, porque
# depende de acesso ao DNS do lado do cliente. A regra é inegociável: a URL
# final do anúncio precisa ser um domínio da América. Publicar em
# *.workers.dev serve só para revisão interna, nunca como destino de anúncio.
#
#   npm run build
#   npx wrangler deploy
#
# Depois de o DNS existir, descomente o bloco `routes` e ajuste SITE_URL em
# src/lib/config.ts para o endereço real.

name = "america-rental-car-lp-atendimento"
main = "dist/server/server.js"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"
binding = "ASSETS"

# [[routes]]
# pattern = "lp.america-rentalcar.com.br"
# custom_domain = true
